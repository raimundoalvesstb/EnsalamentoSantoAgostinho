<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F3A8A">
<title>Ensalamento · Escola Santo Agostinho</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3A8A'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23FFC81E' font-weight='bold'%3EE%3C/text%3E%3C/svg%3E">
<style>
/* ===== 1. VARIÁVEIS ===== */
:root {
  --cor-titulo: #1F3A8A;
  --cor-azul-faixa: #2563C9;
  --cor-azul-claro: #E6F0FF;
  --cor-amarelo-sol: #FFC81E;
  --cor-laranja-tarde: #F58A1F;
  --cor-piso1: #1E6FD9;
  --cor-piso2: #2E9D42;
  --cor-piso3: #7B3FB5;
  --cor-fundo: #F7FAFF;
  --cor-cartao: #FFFFFF;
  --cor-esmaecido-texto: #8A94A6;
  --cor-erro: #C62828;
  --cor-borda-cartao: #2563C9;
  --cor-texto-corpo: #2D3748;
  --escala-fonte: 1;
  --raio-borda: 16px;
  --sombra-cartao: 0 2px 8px rgba(31,58,138,.10);
  --sombra-destaque: 0 0 0 4px rgba(255,200,30,.40), 0 4px 16px rgba(255,200,30,.18);
  --transicao: .25s ease;
}

/* ===== 2. BASE ===== */
*, *::before, *::after { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  font-size: calc(100% * var(--escala-fonte, 1));
}
body {
  margin: 0; padding: 0;
  background: var(--cor-fundo);
  color: var(--cor-texto-corpo);
  font-family: "Trebuchet MS", "Segoe UI", "Nunito", system-ui, -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 3. LAYOUT ===== */
.conteiner-principal {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 12px;
  padding-left: calc(12px + env(safe-area-inset-left, 0px));
  padding-right: calc(12px + env(safe-area-inset-right, 0px));
}

/* ===== 4. COMPONENTES ===== */

/* --- Cabeçalho --- */
.cabecalho-do-sistema {
  background: linear-gradient(135deg, var(--cor-titulo) 0%, #2A4BB5 100%);
  color: #fff;
  padding: 8px 12px 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cabecalho-barra-topo {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  margin-bottom: 2px;
  position: relative;
  z-index: 3;
}
.cabecalho-acoes {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0, 0, 0, 0.22);
  padding: 4px 6px;
  border-radius: 12px;
  backdrop-filter: blur(4px);
}
.controles-escala {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.indicador-escala {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--cor-amarelo-sol);
  padding: 0 4px;
  min-width: 36px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  user-select: none;
}
.botao-icone {
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.88rem;
  font-weight: 800;
  transition: all var(--transicao);
}
.botao-icone:hover:not(:disabled) {
  background: rgba(255,255,255,.32);
}
.botao-icone:disabled {
  cursor: not-allowed;
  opacity: 0.35;
}
.botao-icone:focus-visible {
  outline: 2px solid var(--cor-amarelo-sol);
  outline-offset: 2px;
}
.cabecalho-conteudo {
  position: relative;
  z-index: 2;
}
.cabecalho-do-sistema::after {
  content: '';
  position: absolute;
  bottom: -24px; left: -10%;
  width: 120%; height: 42px;
  background: var(--cor-fundo);
  border-radius: 50% 50% 0 0;
  z-index: 1;
  pointer-events: none;
}
.cabecalho-titulo {
  font-size: clamp(1.35rem, 4.6vw, 2.3rem);
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 2px 2px 0 rgba(0,0,0,.25);
  margin: 0 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: nowrap;
}
.cabecalho-titulo-texto {
  white-space: nowrap;
}
.cabecalho-titulo .icone-cabecalho {
  width: clamp(26px, 4.8vw, 40px);
  height: clamp(26px, 4.8vw, 40px);
  flex-shrink: 0;
}
.cabecalho-subtitulo {
  display: inline-block;
  background: var(--cor-azul-faixa);
  color: #fff;
  padding: 4px 18px;
  border-radius: 20px;
  font-size: clamp(0.72rem, 1.8vw, 0.92rem);
  font-weight: 800;
  margin: 4px 0;
  letter-spacing: 1.5px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.cabecalho-frase {
  font-style: italic;
  font-size: clamp(0.68rem, 1.8vw, 0.88rem);
  opacity: .95;
  margin: 6px 0 0;
  line-height: 1.35;
  padding: 0 8px;
  text-shadow: 1px 1px 2px rgba(0,0,0,.2);
}

/* --- Faixa Tarde --- */
.faixa-tarde {
  background: linear-gradient(135deg, var(--cor-laranja-tarde) 0%, #E87A10 100%);
  color: #fff;
  text-align: center;
  padding: 8px 18px;
  font-weight: 800;
  font-size: clamp(0.88rem, 2.4vw, 1.15rem);
  letter-spacing: 2px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 3;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(245,138,31,.35);
  margin: -10px auto 0;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
}
.faixa-tarde .icone-faixa {
  width: 24px; height: 24px;
  margin: 0 10px;
  flex-shrink: 0;
}

/* --- Relógio e Situação --- */
.painel-relogio {
  text-align: center;
  padding: 22px 8px 10px;
}
.relogio-hora {
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 900;
  color: var(--cor-titulo);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}
.relogio-data {
  font-size: clamp(0.75rem, 2vw, 0.95rem);
  color: #5A6A80;
  margin-top: 2px;
}
.situacao-do-momento {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: clamp(0.7rem, 1.8vw, 0.85rem);
  font-weight: 700;
  margin-top: 6px;
}
.situacao--em-aula {
  background: #E8F5E9;
  color: #2E7D32;
}
.situacao--intervalo {
  background: #FFF3E0;
  color: #E65100;
}
.situacao--antes {
  background: var(--cor-azul-claro);
  color: var(--cor-azul-faixa);
}
.situacao--fim {
  background: #ECEFF1;
  color: #546E7A;
}
.situacao--sem-aula {
  background: #FFF8E1;
  color: #F57F17;
}
.situacao--consulta {
  background: #E8EAF6;
  color: #283593;
}

/* --- Abas --- */
.barra-de-abas {
  display: flex;
  margin: 12px 0 0;
  border-radius: 12px;
  background: var(--cor-azul-claro);
  padding: 4px;
}
.aba-botao {
  flex: 1;
  padding: 10px 6px;
  border: none;
  background: transparent;
  color: var(--cor-titulo);
  font-weight: 700;
  font-size: clamp(0.72rem, 2vw, 0.88rem);
  cursor: pointer;
  border-radius: 10px;
  transition: all var(--transicao);
  display: flex;
  align-items: center;
  justify-content: center;
}
.aba-botao .icone-aba {
  width: 18px; height: 18px;
  margin-right: 4px;
  flex-shrink: 0;
}
.aba-botao--ativa {
  background: #fff;
  color: var(--cor-titulo);
  box-shadow: 0 2px 8px rgba(31,58,138,.12);
}
.aba-botao:hover:not(.aba-botao--ativa) {
  background: rgba(255,255,255,.5);
}
.aba-botao:focus-visible {
  outline: 2px solid var(--cor-amarelo-sol);
  outline-offset: -2px;
}

/* --- Barra de busca global com autocomplete --- */
.conteiner-busca-global {
  position: relative;
  margin: 12px 0 10px;
  width: 100%;
}
.campo-busca-envoltura {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.icone-busca-global {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: #718096;
  pointer-events: none;
}
.campo-busca-global {
  width: 100%;
  padding: 12px 42px 12px 42px;
  border: 2px solid #CBD5E0;
  border-radius: 12px;
  font-size: clamp(0.88rem, 2.3vw, 1rem);
  font-family: inherit;
  font-weight: 500;
  color: var(--cor-titulo);
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(15,23,42,.04);
  transition: border-color var(--transicao), box-shadow var(--transicao);
  -webkit-appearance: none;
  appearance: none;
}
.campo-busca-global:focus {
  outline: none;
  border-color: var(--cor-azul-faixa);
  box-shadow: 0 0 0 3px rgba(37,99,201,.18);
}
.campo-busca-global::placeholder {
  color: #A0AEC0;
  font-weight: 400;
}
.campo-busca-global::-webkit-search-cancel-button,
.campo-busca-global::-webkit-search-decoration {
  -webkit-appearance: none;
  display: none;
}
.botao-limpar-busca {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border: none;
  background: #E2E8F0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #4A5568;
  padding: 0;
  transition: background var(--transicao), color var(--transicao);
}
.botao-limpar-busca:hover {
  background: #CBD5E0;
  color: #1A202C;
}
.botao-limpar-busca:focus-visible {
  outline: 2px solid var(--cor-azul-faixa);
  outline-offset: 1px;
}
.botao-limpar-busca svg {
  width: 16px;
  height: 16px;
}

/* --- Dropdown de Autocomplete --- */
.menu-autocomplete {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 1000;
  background: #FFFFFF;
  border: 1.5px solid #CBD5E0;
  border-radius: 12px;
  box-shadow: 0 12px 28px -4px rgba(15,23,42,.18), 0 4px 10px -2px rgba(15,23,42,.08);
  max-height: 380px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px 0;
}
.autocomplete-grupo {
  padding: 4px 0;
}
.autocomplete-grupo + .autocomplete-grupo {
  border-top: 1px solid #E2E8F0;
  margin-top: 4px;
  padding-top: 6px;
}
.autocomplete-grupo-cabecalho {
  padding: 6px 14px 4px;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #718096;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.autocomplete-grupo-tag {
  background: #EDF2F7;
  color: #4A5568;
  font-size: 0.68rem;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 700;
}
.autocomplete-item {
  display: flex;
  align-items: center;
  padding: 9px 14px;
  cursor: pointer;
  transition: background 0.12s ease;
  user-select: none;
}
.autocomplete-item:hover,
.autocomplete-item--ativo {
  background: #EBF4FF;
}
.autocomplete-icone-bloco {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  flex-shrink: 0;
}
.autocomplete-icone-bloco svg {
  width: 18px;
  height: 18px;
}
.autocomplete-icone-bloco--prof {
  background: #E0E7FF;
  color: #3730A3;
}
.autocomplete-icone-bloco--piso-1 {
  background: rgba(37,99,201,.12);
  color: var(--cor-azul-faixa);
}
.autocomplete-icone-bloco--piso-2 {
  background: rgba(34,139,34,.12);
  color: var(--cor-verde-folha);
}
.autocomplete-icone-bloco--piso-3 {
  background: rgba(147,51,234,.14);
  color: var(--cor-roxo-piso3);
}
.autocomplete-info {
  flex: 1;
  min-width: 0;
}
.autocomplete-titulo {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--cor-titulo);
  line-height: 1.25;
}
.autocomplete-subtitulo {
  font-size: 0.76rem;
  color: #718096;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.autocomplete-badge {
  font-size: 0.7rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  margin-left: 10px;
  flex-shrink: 0;
  white-space: nowrap;
}
.autocomplete-badge--prof {
  background: #EEF2FF;
  color: #4338CA;
}
.autocomplete-badge--piso-1 {
  background: #EBF3FD;
  color: #174EB0;
}
.autocomplete-badge--piso-2 {
  background: #E8F5E9;
  color: #1B7A2D;
}
.autocomplete-badge--piso-3 {
  background: #F3E8FF;
  color: #5B2B8E;
}
.autocomplete-vazio {
  padding: 20px 14px;
  text-align: center;
  color: #718096;
  font-size: 0.88rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.autocomplete-vazio svg {
  width: 28px;
  height: 28px;
  color: #A0AEC0;
}

/* Compatibilidade caso referenciado */
.campo-de-busca-conteiner { position: relative; margin: 12px 0 8px; }
.campo-de-busca { width: 100%; padding: 12px 44px 12px 16px; border: 2px solid #CBD5E0; border-radius: 12px; }


/* --- Seletor de dia --- */
.seletor-de-dia {
  display: flex;
  align-items: center;
  margin: 10px 0;
  gap: 4px;
  flex-wrap: nowrap;
}
.dia-botao {
  flex: 1 1 0;
  min-width: 38px;
  min-height: 42px;
  padding: 6px 2px;
  border: 2px solid transparent;
  background: #EDF3FC;
  color: var(--cor-titulo);
  font-weight: 700;
  font-size: clamp(0.72rem, 1.8vw, 0.85rem);
  cursor: pointer;
  border-radius: 8px;
  transition: all var(--transicao);
}
.dia-botao--ativo {
  background: var(--cor-titulo);
  color: #fff;
  box-shadow: 0 2px 6px rgba(31,58,138,.2);
}
.dia-botao--hoje:not(.dia-botao--ativo) {
  border-color: var(--cor-azul-faixa);
}
.dia-botao:hover:not(.dia-botao--ativo) {
  background: #DFEBFB;
}
.dia-botao:focus-visible {
  outline: 2px solid var(--cor-amarelo-sol);
  outline-offset: 2px;
}
.botao-hoje {
  flex: 0 0 auto;
  min-height: 42px;
  padding: 6px 14px;
  border: 2px solid var(--cor-azul-faixa);
  background: #fff;
  color: var(--cor-azul-faixa);
  font-weight: 800;
  font-size: clamp(0.72rem, 1.8vw, 0.85rem);
  cursor: pointer;
  border-radius: 8px;
  transition: all var(--transicao);
  white-space: nowrap;
}
.botao-hoje:hover {
  background: var(--cor-azul-claro);
}
.botao-hoje:focus-visible {
  outline: 2px solid var(--cor-amarelo-sol);
  outline-offset: 2px;
}

/* --- Sugestões --- */
.lista-de-sugestoes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}
.sugestao-chip {
  padding: 8px 14px;
  border: 2px solid var(--cor-azul-faixa);
  background: #fff;
  color: var(--cor-titulo);
  font-weight: 600;
  font-size: clamp(0.75rem, 2vw, 0.88rem);
  border-radius: 20px;
  cursor: pointer;
  transition: all var(--transicao);
  min-height: 44px;
  display: flex;
  align-items: center;
}
.sugestao-chip:hover, .sugestao-chip:focus-visible {
  background: var(--cor-azul-faixa);
  color: #fff;
}
.sugestao-chip:focus-visible {
  outline: 2px solid var(--cor-amarelo-sol);
  outline-offset: 2px;
}
.sugestao-chip svg {
  width: 18px;
  height: 18px;
  max-width: 18px;
  max-height: 18px;
  flex-shrink: 0;
  margin-right: 6px;
  vertical-align: middle;
}
.sugestao-chip--turma {
  min-width: 60px;
  justify-content: center;
}
.sugestao-chip--piso-1 {
  border-color: var(--cor-piso1);
  color: #174EB0;
}
.sugestao-chip--piso-1:hover, .sugestao-chip--piso-1:focus-visible {
  background: var(--cor-piso1);
  color: #fff;
}
.sugestao-chip--piso-2 {
  border-color: var(--cor-piso2);
  color: #1B7A2D;
}
.sugestao-chip--piso-2:hover, .sugestao-chip--piso-2:focus-visible {
  background: var(--cor-piso2);
  color: #fff;
}
.sugestao-chip--piso-3 {
  border-color: var(--cor-piso3);
  color: #5B2B8E;
}
.sugestao-chip--piso-3:hover, .sugestao-chip--piso-3:focus-visible {
  background: var(--cor-piso3);
  color: #fff;
}

/* --- Grade de turmas por piso --- */
.grade-de-turmas {
  margin: 12px 0;
}
.grupo-piso {
  margin-bottom: 14px;
}
.grupo-piso-titulo {
  display: flex;
  align-items: center;
  font-weight: 800;
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  padding: 6px 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  color: #fff;
}
.grupo-piso-titulo--1 { background: var(--cor-piso1); }
.grupo-piso-titulo--2 { background: var(--cor-piso2); }
.grupo-piso-titulo--3 { background: var(--cor-piso3); }
.grupo-piso-titulo .icone-degraus {
  width: 18px; height: 18px;
  margin-right: 6px;
}
.grupo-piso-turmas {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* --- Cartão de aula (boxes das aulas por cor do piso) --- */
.cartao-aula {
  background: var(--cor-cartao);
  border: 3px solid #CBD5E0;
  border-radius: var(--raio-borda);
  padding: 14px 16px;
  margin: 0 0 12px;
  box-shadow: var(--sombra-cartao);
  transition: all var(--transicao);
  position: relative;
}

/* Piso 1: Box Azul (Ensalamento.jpeg) */
.cartao-aula--piso-1 {
  border-color: var(--cor-piso1);
  box-shadow: 0 3px 12px rgba(30, 111, 217, 0.12);
}
.cartao-aula--piso-1 .cartao-disciplina {
  color: #174EB0;
}

/* Piso 2: Box Verde (Ensalamento.jpeg) */
.cartao-aula--piso-2 {
  border-color: var(--cor-piso2);
  box-shadow: 0 3px 12px rgba(46, 157, 66, 0.12);
}
.cartao-aula--piso-2 .cartao-disciplina {
  color: #1B7A2D;
}

/* Piso 3: Box Roxo (Ensalamento.jpeg) */
.cartao-aula--piso-3 {
  border-color: var(--cor-piso3);
  box-shadow: 0 3px 12px rgba(123, 63, 181, 0.12);
}
.cartao-aula--piso-3 .cartao-disciplina {
  color: #5B2B8E;
}

/* Estado AGORA mantendo a cor do piso */
.cartao-aula--agora {
  border-width: 3.5px;
  box-shadow: 0 0 0 3.5px rgba(255, 200, 30, 0.50), 0 6px 18px rgba(0, 0, 0, 0.12);
}
.cartao-aula--agora::before {
  content: '';
  position: absolute;
  top: -1px; left: -1px; right: -1px; bottom: -1px;
  border-radius: var(--raio-borda);
  background: linear-gradient(135deg, rgba(255,200,30,.10), rgba(255,200,30,.02));
  pointer-events: none;
  z-index: 0;
}

/* Estado PRÓXIMA (borda tracejada na cor do piso) */
.cartao-aula--proxima {
  border-style: dashed;
}
.cartao-aula--piso-1.cartao-aula--proxima { border-color: var(--cor-piso1); }
.cartao-aula--piso-2.cartao-aula--proxima { border-color: var(--cor-piso2); }
.cartao-aula--piso-3.cartao-aula--proxima { border-color: var(--cor-piso3); }

/* Estado PASSADA */
.cartao-aula--passada {
  opacity: .55;
  filter: grayscale(.45);
}
/* Estado FUTURA: mantém a cor padrão do piso já configurada */

.cartao-cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}
.cartao-horario {
  font-weight: 800;
  font-size: clamp(0.8rem, 2.2vw, 1rem);
  color: var(--cor-titulo);
}
.cartao-numero-aula {
  font-size: clamp(0.65rem, 1.6vw, 0.78rem);
  color: #5A6A80;
  font-weight: 600;
}
.cartao-corpo {
  position: relative;
  z-index: 1;
}
.cartao-disciplina {
  font-weight: 800;
  font-size: clamp(0.88rem, 2.5vw, 1.1rem);
  color: var(--cor-titulo);
  margin-bottom: 2px;
}
.cartao-professor, .cartao-turma-info {
  font-size: clamp(0.78rem, 2vw, 0.92rem);
  color: #4A5568;
}
.cartao-rodape {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
  position: relative;
  z-index: 1;
}

/* --- Selos --- */
.selo {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: clamp(0.6rem, 1.5vw, 0.72rem);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.selo--agora {
  background: var(--cor-amarelo-sol);
  color: var(--cor-titulo);
  animation: pulsar-selo 2s ease-in-out infinite;
}
.selo--proxima {
  background: var(--cor-azul-faixa);
  color: #fff;
}
.selo--a-seguir {
  background: var(--cor-azul-claro);
  color: var(--cor-azul-faixa);
}
.selo--intervalo {
  background: var(--cor-laranja-tarde);
  color: #fff;
}
.selo--encerrada {
  background: #ECEFF1;
  color: #78909C;
}
.selo--aula-dupla {
  background: #E8EAF6;
  color: #3F51B5;
  font-size: clamp(0.55rem, 1.3vw, 0.65rem);
}

/* --- Selo de piso --- */
.selo-piso {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: clamp(0.62rem, 1.5vw, 0.75rem);
  font-weight: 700;
  color: #fff;
}
.selo-piso--1 { background: var(--cor-piso1); }
.selo-piso--2 { background: var(--cor-piso2); }
.selo-piso--3 { background: var(--cor-piso3); }
.icone-piso-pequeno {
  width: 16px;
  height: 16px;
  margin-right: 6px;
  flex-shrink: 0;
  vertical-align: middle;
}
.selo-piso .icone-piso-pequeno {
  width: 14px;
  height: 14px;
  margin-right: 4px;
}

/* --- Contagem regressiva --- */
/* --- Mini Mapa SVG do Piso --- */
.mini-mapa-piso {
  margin-top: 10px;
  width: 100%;
}
.mini-mapa-piso svg {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
}

/* Apenas para telas maiores: limita a largura a um tamanho confortável e amigável */
@media (min-width: 768px) {
  .mini-mapa-piso svg {
    width: 100%;
    max-width: 420px;
    height: auto;
  }
}

@media (min-width: 1024px) {
  .mini-mapa-piso svg {
    width: 100%;
    max-width: 440px;
    height: auto;
  }
}

.contagem-regressiva {
  font-size: clamp(0.65rem, 1.6vw, 0.78rem);
  color: #5A6A80;
  font-weight: 600;
}

/* --- Lista de professores A-Z --- */
.lista-professores-az {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}

/* --- Seção de resultados --- */
.secao-rotulo {
  font-weight: 800;
  font-size: clamp(0.72rem, 1.8vw, 0.85rem);
  color: var(--cor-titulo);
  padding: 6px 0;
  margin-top: 8px;
  border-bottom: 2px solid var(--cor-azul-claro);
  display: flex;
  align-items: center;
}
.secao-rotulo .icone-secao {
  width: 16px; height: 16px;
  margin-right: 6px;
}

/* --- Cabeçalho turma --- */
.cabecalho-turma-resultado {
  background: var(--cor-azul-claro);
  border-radius: 12px;
  padding: 10px 14px;
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.cabecalho-turma-nome {
  font-weight: 800;
  font-size: clamp(1rem, 3vw, 1.3rem);
  color: var(--cor-titulo);
}

/* --- Mensagens de estado --- */
.mensagem-estado {
  text-align: center;
  padding: 32px 16px;
  color: #5A6A80;
}
.mensagem-estado .icone-estado {
  width: 56px; height: 56px;
  margin-bottom: 12px;
  opacity: .6;
}
.mensagem-estado-texto {
  font-size: clamp(0.85rem, 2.2vw, 1rem);
  line-height: 1.6;
}

/* --- Painel Agora na escola --- */
.painel-agora {
  margin: 12px 0;
}
.painel-agora-piso {
  margin-bottom: 16px;
}
.painel-agora-turma {
  background: #fff;
  border: 2px solid #E2E8F0;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  transition: all var(--transicao);
}
.painel-agora-turma--piso-1 { border-left: 5px solid var(--cor-piso1); }
.painel-agora-turma--piso-2 { border-left: 5px solid var(--cor-piso2); }
.painel-agora-turma--piso-3 { border-left: 5px solid var(--cor-piso3); }
.painel-agora-turma-nome {
  font-weight: 800;
  font-size: clamp(0.85rem, 2.2vw, 1rem);
  color: var(--cor-titulo);
}
.painel-agora-professor {
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  color: #4A5568;
}
.painel-agora-disciplina {
  font-size: clamp(0.7rem, 1.8vw, 0.82rem);
  color: #718096;
  font-weight: 600;
}

/* --- Checkbox Janelas --- */
.checkbox-janelas {
  display: flex;
  align-items: center;
  margin: 8px 0;
  font-size: clamp(0.72rem, 1.8vw, 0.85rem);
  color: #5A6A80;
  cursor: pointer;
}
.checkbox-janelas input {
  margin-right: 8px;
  width: 18px; height: 18px;
  cursor: pointer;
}

/* --- Rodapé --- */
.rodape-do-sistema {
  text-align: center;
  padding: 20px 12px 16px;
  color: var(--cor-titulo);
  font-weight: 800;
  font-size: clamp(0.7rem, 2vw, 0.88rem);
  letter-spacing: 1px;
}
.rodape-frase {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}
.rodape-frase .icone-estrela-rodape {
  width: 18px; height: 18px;
  margin: 0 4px;
}
.rodape-versao {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: clamp(0.55rem, 1.3vw, 0.65rem);
  color: #A0AEC0;
  font-weight: 400;
  margin-top: 6px;
}
.rodape-separador {
  color: #CBD5E0;
  user-select: none;
}
.rodape-link {
  color: #718096;
  text-decoration: underline;
  text-underline-offset: 2px;
  transition: color 0.2s ease;
}
.rodape-link:hover,
.rodape-link:focus-visible {
  color: var(--cor-azul-marinho);
}

/* --- Painel de simulação --- */
.painel-simulacao {
  background: #FFF8E1;
  border: 2px solid var(--cor-amarelo-sol);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 8px 0;
  display: none;
}
.painel-simulacao.aberto { display: block; }
.painel-simulacao-titulo {
  font-weight: 800;
  font-size: clamp(0.78rem, 2vw, 0.92rem);
  color: var(--cor-titulo);
  margin-bottom: 8px;
}
.painel-simulacao label {
  font-size: clamp(0.72rem, 1.8vw, 0.85rem);
  color: #5A6A80;
  display: block;
  margin-bottom: 4px;
}
.painel-simulacao input[type="datetime-local"] {
  width: 100%;
  padding: 8px 12px;
  border: 2px solid #CBD5E0;
  border-radius: 8px;
  font-size: clamp(0.78rem, 2vw, 0.88rem);
  font-family: inherit;
  margin-bottom: 8px;
}
.painel-simulacao-botoes {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.painel-simulacao-botoes button {
  padding: 8px 14px;
  border: 2px solid var(--cor-azul-faixa);
  background: #fff;
  color: var(--cor-azul-faixa);
  font-weight: 700;
  font-size: clamp(0.7rem, 1.8vw, 0.82rem);
  border-radius: 8px;
  cursor: pointer;
  min-height: 44px;
  transition: all var(--transicao);
}
.painel-simulacao-botoes button:hover {
  background: var(--cor-azul-faixa);
  color: #fff;
}
.painel-simulacao-indicador {
  background: var(--cor-amarelo-sol);
  color: var(--cor-titulo);
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 700;
  font-size: clamp(0.65rem, 1.6vw, 0.78rem);
  text-align: center;
  margin-top: 6px;
  display: none;
}
.painel-simulacao-indicador.ativo { display: block; }

/* --- Diagnóstico --- */
.painel-diagnostico {
  background: #FFF3E0;
  border: 2px solid #FF9800;
  border-radius: 12px;
  padding: 12px 14px;
  margin: 8px 0;
  display: none;
  font-size: clamp(0.7rem, 1.8vw, 0.82rem);
}
.painel-diagnostico.aberto { display: block; }
.painel-diagnostico-titulo {
  font-weight: 800;
  color: #E65100;
  margin-bottom: 6px;
}
.painel-diagnostico ul {
  margin: 0; padding: 0 0 0 18px;
}
.painel-diagnostico li {
  margin-bottom: 4px;
  color: #BF360C;
}

/* --- Erro --- */
.erro-global {
  background: #FFEBEE;
  border: 2px solid var(--cor-erro);
  color: var(--cor-erro);
  border-radius: 12px;
  padding: 16px;
  margin: 16px 12px;
  text-align: center;
  font-weight: 700;
}

/* ===== 5. ESTADOS / ANIMAÇÕES ===== */
@keyframes pulsar-selo {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ===== 6. RESPONSIVO (mobile-first) ===== */
@media (min-width: 480px) {
  .conteiner-principal { padding: 0 20px; }
  .cartao-aula { padding: 16px 20px; }
}

@media (min-width: 768px) {
  .cabecalho-barra-topo {
    position: absolute;
    top: 12px; right: 16px;
    margin-bottom: 0;
  }
  .cabecalho-do-sistema {
    padding: 18px 24px 34px;
  }
  .conteiner-principal { padding: 0 28px; }
  .painel-agora-piso .grupo-piso-turmas-agora {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .painel-agora-turma {
    flex: 1 1 calc(50% - 8px);
    min-width: 260px;
  }
}

@media (min-width: 1024px) {
  .conteiner-principal { max-width: 1100px; }
  .painel-agora-turma {
    flex: 1 1 calc(33% - 8px);
  }
}

@media (min-width: 1920px) {
  .conteiner-principal { max-width: 1400px; }
  body { font-size: calc(1.1rem * var(--escala-fonte)); }
}

@media (orientation: landscape) and (max-height: 480px) {
  .cabecalho-do-sistema { padding: 8px 12px 6px; }
  .cabecalho-titulo { font-size: 1.2rem; }
  .cabecalho-subtitulo { margin: 4px 0 2px; font-size: 0.7rem; }
  .cabecalho-frase { display: none; }
  .faixa-tarde { margin-top: -4px; padding: 4px 12px; }
}

/* ===== 7. IMPRESSÃO ===== */
@media print {
  body { background: #fff; color: #000; }
  .cabecalho-do-sistema, .faixa-tarde, .barra-de-abas, .conteiner-busca-global,
  .campo-de-busca-conteiner, .seletor-de-dia, .painel-simulacao,
  .cabecalho-acoes, .checkbox-janelas, .painel-diagnostico { display: none !important; }
  .cartao-aula { border-color: #000 !important; box-shadow: none !important; page-break-inside: avoid; }
  .cartao-aula--passada { opacity: 1; filter: none; }
  .rodape-do-sistema { color: #000; }
  @page { margin: 1cm; }
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  function normalizarTextoParaBusca(texto) {
    if (!texto) return '';
    texto = texto.toLowerCase();
    if (typeof texto.normalize === 'function') {
      texto = texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    } else {
      var resultado = '';
      for (var i = 0; i < texto.length; i++) {
        resultado += TABELA_DE_ACENTOS[texto[i]] || texto[i];
      }
      texto = resultado;
    }
    texto = texto.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    return texto;
  }

  function normalizarCodigoDaTurma(texto) {
    if (!texto) return null;
    var t = texto.toLowerCase().trim();
    t = t.replace(/[º°ª_\-\s]/g, '');
    var normalizado = normalizarTextoParaBusca(t);
    if (normalizado === 'robotica' || normalizado === 'tv' || normalizado === 'tvinterativa' || normalizado === 'interativa') return 'ROBOTICA';
    var match = normalizado.match(/^([6-9])([a-d])$/);
    if (match) return match[1] + match[2].toUpperCase();
    return null;
  }

  function converterHoraParaMinutos(hora) {
    var partes = hora.split(':');
    return parseInt(partes[0], 10) * 60 + parseInt(partes[1], 10);
  }

  function formatarMinutosComoHora(minutos) {
    var h = Math.floor(minutos / 60);
    var m = minutos % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function formatarDataPorExtenso(data) {
    var dia = data.getDate();
    var mes = NOMES_DOS_MESES[data.getMonth()];
    var ano = data.getFullYear();
    var diaSemana = data.getDay();
    var nomesDiaSemana = ['Domingo','Segunda-feira','Ter\u00E7a-feira','Quarta-feira','Quinta-feira','Sexta-feira','S\u00E1bado'];
    return nomesDiaSemana[diaSemana] + ', ' + dia + ' de ' + mes + ' de ' + ano;
  }

  function formatarHoraComSegundos(data) {
    var h = data.getHours();
    var m = data.getMinutes();
    var s = data.getSeconds();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function criarElementoSeguro(tag, atributos, texto) {
    var el = document.createElement(tag);
    if (atributos) {
      for (var chave in atributos) {
        if (atributos.hasOwnProperty(chave)) {
          if (chave === 'className') {
            el.className = atributos[chave];
          } else {
            el.setAttribute(chave, atributos[chave]);
          }
        }
      }
    }
    if (texto !== undefined && texto !== null) {
      el.textContent = texto;
    }
    return el;
  }

    if (largura) svg.setAttribute('width', String(largura));

    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');

    use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + idSimbolo);
    svg.appendChild(use);
    return svg;
  }

  function construirIndicesDeBusca() {
    indicePorProfessor = {};
    indicePorTurma = {};
    disciplinasPorProfessor = {};
    var chavesProfessores = {};

    for (var dia = 1; dia <= 5; dia++) {
      var linhasDoDia = DADOS_DA_GRADE[dia];
      if (!linhasDoDia) continue;
      for (var h = 0; h < linhasDoDia.length; h++) {
        var linha = linhasDoDia[h];
        for (var t = 0; t < ORDEM_DAS_TURMAS.length; t++) {
          var celula = linha[t];
          if (!celula || celula.trim() === '') continue;
          var partes = celula.split('|');
          if (partes.length < 2) continue;
          var sigla = partes[0].trim();
          var chaveProf = partes[1].trim().toUpperCase();
          var codigoTurma = ORDEM_DAS_TURMAS[t];
          var horario = CONFIGURACAO.horarios[h];
          var sala = SALAS_DAS_TURMAS[codigoTurma] || { piso: 0, rotulo: 'Desconhecida', tvInterativa: false };
          var nomeDisc = DISCIPLINAS[sigla] || sigla;

          var aula = {
            dia: dia,
            numeroDaAula: horario.numero,
            inicio: horario.inicio,
            fim: horario.fim,
            inicioEmMinutos: converterHoraParaMinutos(horario.inicio),
            fimEmMinutos: converterHoraParaMinutos(horario.fim),
            turma: codigoTurma,
            disciplinaSigla: sigla,
            disciplinaNome: nomeDisc,
            professorChave: chaveProf,
            professorNome: PROFESSORES[chaveProf] || chaveProf,
            sala: sala,
            aulaDupla: null
          };

          if (!indicePorProfessor[chaveProf]) indicePorProfessor[chaveProf] = {};
          if (!indicePorProfessor[chaveProf][dia]) indicePorProfessor[chaveProf][dia] = [];
          indicePorProfessor[chaveProf][dia].push(aula);

          if (!indicePorTurma[codigoTurma]) indicePorTurma[codigoTurma] = {};
          if (!indicePorTurma[codigoTurma][dia]) indicePorTurma[codigoTurma][dia] = [];
          indicePorTurma[codigoTurma][dia].push(aula);

          if (!disciplinasPorProfessor[chaveProf]) disciplinasPorProfessor[chaveProf] = [];
          if (disciplinasPorProfessor[chaveProf].indexOf(nomeDisc) === -1) {
            disciplinasPorProfessor[chaveProf].push(nomeDisc);
          }

          chavesProfessores[chaveProf] = PROFESSORES[chaveProf] || chaveProf;
        }
      }
    }

    // Ordenar professores A-Z
    var chaves = [];
    for (var c in chavesProfessores) {
      if (chavesProfessores.hasOwnProperty(c)) {
        chaves.push({ chave: c, nome: chavesProfessores[c] });
      }
    }
    chaves.sort(function(a, b) {
      return normalizarTextoParaBusca(a.nome).localeCompare(normalizarTextoParaBusca(b.nome));
    });
    listaDeProfessoresOrdenada = chaves;

    // Marcar aulas duplas
    for (var cp in indicePorProfessor) {
      if (indicePorProfessor.hasOwnProperty(cp)) {
        for (var d = 1; d <= 5; d++) {
          if (indicePorProfessor[cp][d]) {
            marcarAulasDuplas(indicePorProfessor[cp][d]);
          }
        }
      }
    }
  }

  function marcarAulasDuplas(listaDeAulas) {
    listaDeAulas.sort(function(a, b) { return a.inicioEmMinutos - b.inicioEmMinutos; });
    for (var i = 0; i < listaDeAulas.length - 1; i++) {
      var atual = listaDeAulas[i];
      var prox = listaDeAulas[i + 1];
      if (atual.turma === prox.turma &&
          atual.professorChave === prox.professorChave &&
          atual.fimEmMinutos === prox.inicioEmMinutos) {
        atual.aulaDupla = { parte: 1, total: 2 };
        prox.aulaDupla = { parte: 2, total: 2 };
      }
    }
    return listaDeAulas;
  }

  function listarProfessoresOrdenados() {
    return listaDeProfessoresOrdenada;
  }

  function buscarProfessoresPorTexto(texto) {
    var normalizado = normalizarTextoParaBusca(texto);
    if (!normalizado) return [];
    var resultados = [];
    for (var i = 0; i < listaDeProfessoresOrdenada.length; i++) {
      var prof = listaDeProfessoresOrdenada[i];
      var nomeNorm = normalizarTextoParaBusca(prof.nome);
      if (nomeNorm.indexOf(normalizado) !== -1) {
        resultados.push(prof);
      }
    }
    // Priorizar correspondência exata
    resultados.sort(function(a, b) {
      var normA = normalizarTextoParaBusca(a.nome);
      var normB = normalizarTextoParaBusca(b.nome);
      var exataA = normA === normalizado ? 0 : 1;
      var exataB = normB === normalizado ? 0 : 1;
      if (exataA !== exataB) return exataA - exataB;
      return normA.localeCompare(normB);
    });
    return resultados;
  }

  function buscarTurmasPorTexto(texto) {
    var codigo = normalizarCodigoDaTurma(texto);
    if (!codigo) return [];
    if (indicePorTurma[codigo]) return [codigo];
    return [];
  }

  /* ================================================================
     BLOCO: BUSCA GLOBAL UNIFICADA COM AUTOCOMPLETE
     ================================================================ */

  var indiceSugestaoAtiva = -1;
  var itensSugestoesAtuais = [];

  function buscarSugestoesAutocomplete(termo) {
    var termoNorm = normalizarTextoParaBusca(termo);
    if (!termoNorm) return { turmas: [], professores: [] };

    // 1. Turmas e Salas
    var turmasResultados = [];
    var todasTurmas = [
      { codigo: '8A', nome: '8º A', piso: 1, rotuloPiso: 'Piso 1', salaNome: 'Sala 8º A', tv: false },
      { codigo: '7C', nome: '7º C', piso: 1, rotuloPiso: 'Piso 1', salaNome: 'Sala 7º C', tv: false },
      { codigo: '7A', nome: '7º A', piso: 1, rotuloPiso: 'Piso 1', salaNome: 'Sala 7º A', tv: false },
      { codigo: '7D', nome: '7º D', piso: 2, rotuloPiso: 'Piso 2', salaNome: 'Sala 7º D', tv: false },
      { codigo: '6A', nome: '6º A', piso: 2, rotuloPiso: 'Piso 2', salaNome: 'Sala 6º A', tv: false },
      { codigo: '6B', nome: '6º B', piso: 2, rotuloPiso: 'Piso 2', salaNome: 'Sala 6º B', tv: false },
      { codigo: '7B', nome: '7º B', piso: 2, rotuloPiso: 'Piso 2', salaNome: 'Sala 7º B', tv: false },
      { codigo: 'ROBOTICA', nome: 'TV Interativa', piso: 3, rotuloPiso: 'Piso 3', salaNome: 'TV Interativa', tv: true },
      { codigo: '9C', nome: '9º C', piso: 3, rotuloPiso: 'Piso 3', salaNome: 'Sala 9º C', tv: false },
      { codigo: '8B', nome: '8º B', piso: 3, rotuloPiso: 'Piso 3', salaNome: 'Sala 8º B', tv: false },
      { codigo: '8C', nome: '8º C', piso: 3, rotuloPiso: 'Piso 3', salaNome: 'Sala 8º C', tv: false }
    ];

    for (var t = 0; t < todasTurmas.length; t++) {
      var tm = todasTurmas[t];
      var codNorm = normalizarTextoParaBusca(tm.codigo);
      var nomeNorm = normalizarTextoParaBusca(tm.nome);
      var pisoNorm = normalizarTextoParaBusca(tm.rotuloPiso);
      var salaNorm = normalizarTextoParaBusca(tm.salaNome);

      var bateu = false;
      if (codNorm.indexOf(termoNorm) !== -1 ||
          nomeNorm.indexOf(termoNorm) !== -1 ||
          pisoNorm.indexOf(termoNorm) !== -1 ||
          salaNorm.indexOf(termoNorm) !== -1) {
        bateu = true;
      } else if (tm.tv && (termoNorm.indexOf('tv') !== -1 || termoNorm.indexOf('interativ') !== -1 || termoNorm.indexOf('rob') !== -1)) {
        bateu = true;
      } else {
        var limpo = termoNorm.replace(/\s+/g, '');
        if (codNorm === limpo || codNorm.indexOf(limpo) === 0) bateu = true;
      }

      if (bateu) {
        turmasResultados.push(tm);
      }
    }

    // 2. Professores(as)
    var profsResultados = [];
    for (var i = 0; i < listaDeProfessoresOrdenada.length; i++) {
      var prof = listaDeProfessoresOrdenada[i];
      var pNomeNorm = normalizarTextoParaBusca(prof.nome);
      var discNorm = '';
      var discLista = disciplinasPorProfessor[prof.chave] || [];
      for (var d = 0; d < discLista.length; d++) {
        discNorm += ' ' + normalizarTextoParaBusca(discLista[d]);
      }

      if (pNomeNorm.indexOf(termoNorm) !== -1 || discNorm.indexOf(termoNorm) !== -1) {
        profsResultados.push({
          chave: prof.chave,
          nome: prof.nome,
          disciplinas: discLista.join(', ')
        });
      }
    }

    profsResultados.sort(function(a, b) {
      var aNorm = normalizarTextoParaBusca(a.nome);
      var bNorm = normalizarTextoParaBusca(b.nome);
      var aExato = aNorm === termoNorm ? 0 : 1;
      var bExato = bNorm === termoNorm ? 0 : 1;
      if (aExato !== bExato) return aExato - bExato;
      var aComeca = aNorm.indexOf(termoNorm) === 0 ? 0 : 1;
      var bComeca = bNorm.indexOf(termoNorm) === 0 ? 0 : 1;
      if (aComeca !== bComeca) return aComeca - bComeca;
      return aNorm.localeCompare(bNorm);
    });

    return {
      turmas: turmasResultados,
      professores: profsResultados
    };
  }

  function fecharMenuAutocomplete() {
    var menu = document.getElementById('menu-autocomplete');
    var campo = document.getElementById('campo-de-busca-global');
    if (menu) {
      menu.style.display = 'none';
      limparElemento(menu);
    }
    if (campo) {
      campo.setAttribute('aria-expanded', 'false');
      campo.removeAttribute('aria-activedescendant');
    }
    indiceSugestaoAtiva = -1;
    itensSugestoesAtuais = [];
  }

  function renderizarMenuAutocomplete(dados, termo) {
    var menu = document.getElementById('menu-autocomplete');
    var campo = document.getElementById('campo-de-busca-global');
    if (!menu || !campo) return;

    limparElemento(menu);
    indiceSugestaoAtiva = -1;
    itensSugestoesAtuais = [];

    var totalResultados = dados.turmas.length + dados.professores.length;
    if (totalResultados === 0) {
      var vazio = criarElementoSeguro('div', { className: 'autocomplete-vazio' });
      var ico = criarSvgUse('icone-caderno', '', 28, 28);
      vazio.appendChild(ico);
      var txt = criarElementoSeguro('span', {}, 'Nenhum professor(a) ou turma encontrado para "' + termo + '".');
      vazio.appendChild(txt);
      menu.appendChild(vazio);
      menu.style.display = 'block';
      campo.setAttribute('aria-expanded', 'true');
      return;
    }

    var contadorItem = 0;

    // Seção Turmas / Salas
    if (dados.turmas.length > 0) {
      var grupoTurmas = criarElementoSeguro('div', { className: 'autocomplete-grupo' });
      var cabTurmas = criarElementoSeguro('div', { className: 'autocomplete-grupo-cabecalho' });
      cabTurmas.appendChild(document.createTextNode('Turmas / Salas'));
      var badgeContagemT = criarElementoSeguro('span', { className: 'autocomplete-grupo-tag' }, String(dados.turmas.length));
      cabTurmas.appendChild(badgeContagemT);
      grupoTurmas.appendChild(cabTurmas);

      for (var t = 0; t < dados.turmas.length; t++) {
        (function(tm, idx) {
          var itemEl = criarElementoSeguro('div', {
            className: 'autocomplete-item',
            role: 'option',
            id: 'sugestao-item-' + idx,
            'data-indice': String(idx)
          });

          var icoBloco = criarElementoSeguro('div', { className: 'autocomplete-icone-bloco autocomplete-icone-bloco--piso-' + tm.piso });
          var svgIco = tm.tv ? criarSvgUse('icone-tv', '', 18, 18) : criarSvgUse('icone-turma', '', 18, 18);
          icoBloco.appendChild(svgIco);
          itemEl.appendChild(icoBloco);

          var info = criarElementoSeguro('div', { className: 'autocomplete-info' });
          var tit = criarElementoSeguro('div', { className: 'autocomplete-titulo' }, tm.nome);
          info.appendChild(tit);
          var sub = criarElementoSeguro('div', { className: 'autocomplete-subtitulo' }, (tm.tv ? 'Sala TV Interativa \u00B7 ' : 'Sala ' + tm.nome + ' \u00B7 ') + tm.rotuloPiso);
          info.appendChild(sub);
          itemEl.appendChild(info);

          var badgePiso = criarElementoSeguro('span', { className: 'autocomplete-badge autocomplete-badge--piso-' + tm.piso }, tm.rotuloPiso);
          itemEl.appendChild(badgePiso);

          itemEl.addEventListener('click', function() {
            selecionarSugestaoTurma(tm.codigo, tm.nome);
          });

          grupoTurmas.appendChild(itemEl);
          itensSugestoesAtuais.push({
            tipo: 'turma',
            codigo: tm.codigo,
            nome: tm.nome,
            elemento: itemEl
          });
        })(dados.turmas[t], contadorItem++);
      }
      menu.appendChild(grupoTurmas);
    }

    // Seção Professores(as)
    if (dados.professores.length > 0) {
      var grupoProfs = criarElementoSeguro('div', { className: 'autocomplete-grupo' });
      var cabProfs = criarElementoSeguro('div', { className: 'autocomplete-grupo-cabecalho' });
      cabProfs.appendChild(document.createTextNode('Professores(as)'));
      var badgeContagemP = criarElementoSeguro('span', { className: 'autocomplete-grupo-tag' }, String(dados.professores.length));
      cabProfs.appendChild(badgeContagemP);
      grupoProfs.appendChild(cabProfs);

      for (var p = 0; p < dados.professores.length; p++) {
        (function(prof, idx) {
          var itemEl = criarElementoSeguro('div', {
            className: 'autocomplete-item',
            role: 'option',
            id: 'sugestao-item-' + idx,
            'data-indice': String(idx)
          });

          var icoBloco = criarElementoSeguro('div', { className: 'autocomplete-icone-bloco autocomplete-icone-bloco--prof' });
          icoBloco.appendChild(criarSvgUse('icone-professor', '', 18, 18));
          itemEl.appendChild(icoBloco);

          var info = criarElementoSeguro('div', { className: 'autocomplete-info' });
          var tit = criarElementoSeguro('div', { className: 'autocomplete-titulo' }, prof.nome);
          info.appendChild(tit);
          if (prof.disciplinas) {
            var sub = criarElementoSeguro('div', { className: 'autocomplete-subtitulo' }, prof.disciplinas);
            info.appendChild(sub);
          }
          itemEl.appendChild(info);

          var badgeProf = criarElementoSeguro('span', { className: 'autocomplete-badge autocomplete-badge--prof' }, 'Professor(a)');
          itemEl.appendChild(badgeProf);

          itemEl.addEventListener('click', function() {
            selecionarSugestaoProfessor(prof.chave, prof.nome);
          });

          grupoProfs.appendChild(itemEl);
          itensSugestoesAtuais.push({
            tipo: 'professor',
            chave: prof.chave,
            nome: prof.nome,
            elemento: itemEl
          });
        })(dados.professores[p], contadorItem++);
      }
      menu.appendChild(grupoProfs);
    }

    menu.style.display = 'block';
    campo.setAttribute('aria-expanded', 'true');
  }

  function destacarItemSugestao(novoIndice) {
    if (itensSugestoesAtuais.length === 0) return;
    var campo = document.getElementById('campo-de-busca-global');

    for (var i = 0; i < itensSugestoesAtuais.length; i++) {
      itensSugestoesAtuais[i].elemento.classList.remove('autocomplete-item--ativo');
    }

    if (novoIndice < 0) {
      novoIndice = itensSugestoesAtuais.length - 1;
    } else if (novoIndice >= itensSugestoesAtuais.length) {
      novoIndice = 0;
    }

    indiceSugestaoAtiva = novoIndice;
    var itemAtivo = itensSugestoesAtuais[indiceSugestaoAtiva];
    if (itemAtivo && itemAtivo.elemento) {
      itemAtivo.elemento.classList.add('autocomplete-item--ativo');
      itemAtivo.elemento.scrollIntoView({ block: 'nearest' });
      if (campo) {
        campo.setAttribute('aria-activedescendant', 'sugestao-item-' + indiceSugestaoAtiva);
      }
    }
  }

  function selecionarSugestaoAtiva() {
    if (itensSugestoesAtuais.length === 0) return false;
    var idx = indiceSugestaoAtiva >= 0 ? indiceSugestaoAtiva : 0;
    var item = itensSugestoesAtuais[idx];
    if (!item) return false;

    if (item.tipo === 'professor') {
      selecionarSugestaoProfessor(item.chave, item.nome);
    } else if (item.tipo === 'turma') {
      selecionarSugestaoTurma(item.codigo, item.nome);
    }
    return true;
  }

  function selecionarSugestaoProfessor(chave, nome) {
    var campo = document.getElementById('campo-de-busca-global');
    if (campo) campo.value = nome;
    var btnLimpar = document.getElementById('botao-limpar-busca');
    if (btnLimpar) btnLimpar.style.display = 'inline-flex';
    fecharMenuAutocomplete();

    estadoDoSistema.abaAtiva = 'professor';
    estadoDoSistema.professorSelecionado = chave;
    estadoDoSistema.turmaSelecionada = null;
    estadoDoSistema.termoDigitado = '';

    atualizarAbas();
    renderizarTelaAtual();
  }

  function selecionarSugestaoTurma(codigo, nome) {
    var campo = document.getElementById('campo-de-busca-global');
    if (campo) campo.value = nome;
    var btnLimpar = document.getElementById('botao-limpar-busca');
    if (btnLimpar) btnLimpar.style.display = 'inline-flex';
    fecharMenuAutocomplete();

    estadoDoSistema.abaAtiva = 'turma';
    estadoDoSistema.turmaSelecionada = codigo;
    estadoDoSistema.professorSelecionado = null;
    estadoDoSistema.termoDigitado = '';

    atualizarAbas();
    renderizarTelaAtual();
  }

  function limparBuscaGlobal() {
    var campo = document.getElementById('campo-de-busca-global');
    if (campo) {
      campo.value = '';
      campo.focus();
    }
    var btnLimpar = document.getElementById('botao-limpar-busca');
    if (btnLimpar) btnLimpar.style.display = 'none';
    fecharMenuAutocomplete();

    estadoDoSistema.professorSelecionado = null;
    estadoDoSistema.turmaSelecionada = null;
    estadoDoSistema.termoDigitado = '';

    renderizarTelaAtual();
  }

  function configurarBuscaGlobalComAutocomplete() {
    var campo = document.getElementById('campo-de-busca-global');
    var btnLimpar = document.getElementById('botao-limpar-busca');
    var menu = document.getElementById('menu-autocomplete');
    var conteiner = document.getElementById('conteiner-busca-global');

    if (!campo) return;

    if (btnLimpar) {
      btnLimpar.addEventListener('click', function(e) {
        e.stopPropagation();
        limparBuscaGlobal();
      });
    }

    campo.addEventListener('input', function() {
      var termo = this.value.trim();
      if (btnLimpar) {
        btnLimpar.style.display = this.value.length > 0 ? 'inline-flex' : 'none';
      }

      if (!termo) {
        fecharMenuAutocomplete();
        if (estadoDoSistema.professorSelecionado || estadoDoSistema.turmaSelecionada) {
          estadoDoSistema.professorSelecionado = null;
          estadoDoSistema.turmaSelecionada = null;
          estadoDoSistema.termoDigitado = '';
          renderizarTelaAtual();
        }
        return;
      }

      var dados = buscarSugestoesAutocomplete(termo);
      renderizarMenuAutocomplete(dados, termo);
    });

    campo.addEventListener('focus', function() {
      var termo = this.value.trim();
      if (termo) {
        var dados = buscarSugestoesAutocomplete(termo);
        renderizarMenuAutocomplete(dados, termo);
      }
    });

    campo.addEventListener('keydown', function(e) {
      var menuVisivel = menu && menu.style.display === 'block';

      if (e.key === 'ArrowDown') {
        if (!menuVisivel) {
          var termo = this.value.trim();
          if (termo) {
            var dados = buscarSugestoesAutocomplete(termo);
            renderizarMenuAutocomplete(dados, termo);
          }
        } else {
          e.preventDefault();
          destacarItemSugestao(indiceSugestaoAtiva + 1);
        }
      } else if (e.key === 'ArrowUp') {
        if (menuVisivel) {
          e.preventDefault();
          destacarItemSugestao(indiceSugestaoAtiva - 1);
        }
      } else if (e.key === 'Enter') {
        if (menuVisivel) {
          e.preventDefault();
          selecionarSugestaoAtiva();
        }
      } else if (e.key === 'Escape') {
        if (menuVisivel) {
          e.preventDefault();
          fecharMenuAutocomplete();
        }
      }
    });

    document.addEventListener('click', function(e) {
      if (conteiner && !conteiner.contains(e.target)) {
        fecharMenuAutocomplete();
      }
    });
  }

  function obterAulasDoProfessor(chave, dia) {
    if (!indicePorProfessor[chave] || !indicePorProfessor[chave][dia]) return [];
    return indicePorProfessor[chave][dia].slice();
  }

  function obterAulasDaTurma(codigo, dia) {
    if (!indicePorTurma[codigo] || !indicePorTurma[codigo][dia]) return [];
    return indicePorTurma[codigo][dia].slice();
  }

  function obterSalaDaTurma(codigo) {
    return SALAS_DAS_TURMAS[codigo] || { piso: 0, rotulo: 'Desconhecida', tvInterativa: false };
  }

  function obterDiaDaSemanaLetivo(data) {
    var diaSemana = data.getDay(); // 0=dom 1=seg ... 6=sab
    if (diaSemana === 0 || diaSemana === 6) return null;

    var dataStr = data.getFullYear() + '-' +
      ((data.getMonth() + 1) < 10 ? '0' : '') + (data.getMonth() + 1) + '-' +
      (data.getDate() < 10 ? '0' : '') + data.getDate();

    for (var i = 0; i < CONFIGURACAO.diasSemAula.length; i++) {
      if (CONFIGURACAO.diasSemAula[i] === dataStr) return null;
    }

    return diaSemana; // 1=seg ... 5=sex
  }

  function obterMomentoAtual() {
    if (estadoDoSistema.momentoSimulado) {
      return new Date(estadoDoSistema.momentoSimulado.getTime());
    }
    return new Date();
  }

  function calcularSituacaoDoMomento(momento) {
    var diaLetivo = obterDiaDaSemanaLetivo(momento);
    if (diaLetivo === null) {
      return {
        estado: 'SEM_AULA_HOJE',
        diaLetivo: null,
        proximoDiaLetivo: calcularProximoDiaLetivo(momento)
      };
    }

    var minutosAgora = momento.getHours() * 60 + momento.getMinutes();
    var segundosAgora = momento.getSeconds();
    var primeiraAula = CONFIGURACAO.horarios[0];
    var ultimaAula = CONFIGURACAO.horarios[CONFIGURACAO.horarios.length - 1];
    var inicioPrimeiraEmMin = converterHoraParaMinutos(primeiraAula.inicio);
    var fimUltimaEmMin = converterHoraParaMinutos(ultimaAula.fim);
    var inicioIntervalo = converterHoraParaMinutos(CONFIGURACAO.intervalo.inicio);
    var fimIntervalo = converterHoraParaMinutos(CONFIGURACAO.intervalo.fim);

    if (minutosAgora < inicioPrimeiraEmMin) {
      return {
        estado: 'ANTES_DAS_AULAS',
        diaLetivo: diaLetivo,
        minutosAgora: minutosAgora,
        segundosAgora: segundosAgora,
        numeroProximo: 1
      };
    }

    if (minutosAgora >= fimUltimaEmMin) {
      return {
        estado: 'FIM_DO_PERIODO',
        diaLetivo: diaLetivo,
        minutosAgora: minutosAgora,
        segundosAgora: segundosAgora,
        proximoDiaLetivo: calcularProximoDiaLetivo(momento)
      };
    }

    if (minutosAgora >= inicioIntervalo && minutosAgora < fimIntervalo) {
      return {
        estado: 'INTERVALO',
        diaLetivo: diaLetivo,
        minutosAgora: minutosAgora,
        segundosAgora: segundosAgora,
        numeroProximo: 4
      };
    }

    // Encontrar aula atual
    for (var i = 0; i < CONFIGURACAO.horarios.length; i++) {
      var h = CONFIGURACAO.horarios[i];
      var inicioH = converterHoraParaMinutos(h.inicio);
      var fimH = converterHoraParaMinutos(h.fim);
      if (minutosAgora >= inicioH && minutosAgora < fimH) {
        var proxNum = (i + 1 < CONFIGURACAO.horarios.length) ? CONFIGURACAO.horarios[i + 1].numero : null;
        return {
          estado: 'EM_AULA',
          diaLetivo: diaLetivo,
          minutosAgora: minutosAgora,
          segundosAgora: segundosAgora,
          numeroAtual: h.numero,
          numeroProximo: proxNum
        };
      }
    }

    // Fallback (entre fim de aula e início do intervalo ou algo inesperado)
    return {
      estado: 'EM_AULA',
      diaLetivo: diaLetivo,
      minutosAgora: minutosAgora,
      segundosAgora: segundosAgora,
      numeroAtual: null,
      numeroProximo: null
    };
  }

  function calcularProximoDiaLetivo(data) {
    var tentativa = new Date(data.getTime());
    for (var i = 0; i < 10; i++) {
      tentativa.setDate(tentativa.getDate() + 1);
      if (obterDiaDaSemanaLetivo(tentativa) !== null) {
        return tentativa;
      }
    }
    return null;
  }

  function classificarAulaNoMomento(aula, minutosAgora) {
    if (minutosAgora >= aula.fimEmMinutos) return 'PASSADA';
    if (aula.inicioEmMinutos <= minutosAgora) return 'EM_ANDAMENTO';
    return 'FUTURA';
  }

  function ordenarAulasParaExibicao(lista, situacao, ehConsultaOutroDia) {
    if (ehConsultaOutroDia) {
      lista.sort(function(a, b) { return a.inicioEmMinutos - b.inicioEmMinutos; });
      for (var k = 0; k < lista.length; k++) {
        lista[k].classe = 'CONSULTA';
      }
      return lista;
    }

    var minutosAgora = situacao.minutosAgora;

    // Classificar cada aula
    for (var i = 0; i < lista.length; i++) {
      lista[i].classe = classificarAulaNoMomento(lista[i], minutosAgora);
    }

    // Determinar a PROXIMA
    var temEmAndamento = false;
    for (var j = 0; j < lista.length; j++) {
      if (lista[j].classe === 'EM_ANDAMENTO') { temEmAndamento = true; break; }
    }

    // Ordenar cronologicamente para encontrar a primeira futura
    var futuras = [];
    for (var m = 0; m < lista.length; m++) {
      if (lista[m].classe === 'FUTURA') futuras.push(lista[m]);
    }
    futuras.sort(function(a, b) { return a.inicioEmMinutos - b.inicioEmMinutos; });

    if (futuras.length > 0) {
      if (temEmAndamento) {
        futuras[0].classe = 'A_SEGUIR';
      } else {
        futuras[0].classe = 'PROXIMA';
      }
    }

    // Separar categorias
    var emAndamento = [];
    var proxima = [];
    var aSeguir = [];
    var demaisFuturas = [];
    var passadas = [];

    for (var n = 0; n < lista.length; n++) {
      switch (lista[n].classe) {
        case 'EM_ANDAMENTO': emAndamento.push(lista[n]); break;
        case 'PROXIMA': proxima.push(lista[n]); break;
        case 'A_SEGUIR': aSeguir.push(lista[n]); break;
        case 'FUTURA': demaisFuturas.push(lista[n]); break;
        case 'PASSADA': passadas.push(lista[n]); break;
      }
    }

    demaisFuturas.sort(function(a, b) { return a.inicioEmMinutos - b.inicioEmMinutos; });

    if (CONFIGURACAO.ordemPassadas === 'recentePrimeiro') {
      passadas.sort(function(a, b) { return b.inicioEmMinutos - a.inicioEmMinutos; });
    } else {
      passadas.sort(function(a, b) { return a.inicioEmMinutos - b.inicioEmMinutos; });
    }

    return emAndamento.concat(proxima).concat(aSeguir).concat(demaisFuturas).concat(passadas);
  }

  function obterPanoramaAgoraNaEscola(momento) {
    var situacao = calcularSituacaoDoMomento(momento);
    var diaLetivo = situacao.diaLetivo;
    var resultado = { situacao: situacao, pisos: {} };

    if (!diaLetivo) return resultado;

    for (var i = 0; i < ORDEM_DAS_TURMAS.length; i++) {
      var codigoTurma = ORDEM_DAS_TURMAS[i];
      var sala = obterSalaDaTurma(codigoTurma);
      var aulas = obterAulasDaTurma(codigoTurma, diaLetivo);
      var aulaAtual = null;
      var aulaProxima = null;

      for (var j = 0; j < aulas.length; j++) {
        var classe = classificarAulaNoMomento(aulas[j], situacao.minutosAgora);
        if (classe === 'EM_ANDAMENTO') { aulaAtual = aulas[j]; break; }
        if (classe === 'FUTURA' && !aulaProxima) { aulaProxima = aulas[j]; }
      }

      var piso = sala.piso;
      if (!resultado.pisos[piso]) resultado.pisos[piso] = [];
      resultado.pisos[piso].push({
        turma: codigoTurma,
        sala: sala,
        aulaAtual: aulaAtual,
        aulaProxima: aulaProxima
      });
    }

    return resultado;
  }

  function calcularTempoRestanteParaAula(aula, momento) {
    var minutosAgora = momento.getHours() * 60 + momento.getMinutes();
    var segundosAgora = momento.getSeconds();
    var totalSegundosAgora = minutosAgora * 60 + segundosAgora;

    var classe = classificarAulaNoMomento(aula, minutosAgora);

    if (classe === 'EM_ANDAMENTO') {
      var fimEmSegundos = aula.fimEmMinutos * 60;
      var restante = fimEmSegundos - totalSegundosAgora;
      if (restante < 0) restante = 0;
      return { tipo: 'termina', minutos: Math.floor(restante / 60), segundos: restante % 60 };
    }

    if (classe === 'FUTURA') {
      var inicioEmSegundos = aula.inicioEmMinutos * 60;
      var falta = inicioEmSegundos - totalSegundosAgora;
      if (falta < 0) falta = 0;
      return { tipo: 'comeca', minutos: Math.floor(falta / 60), segundos: falta % 60 };
    }

    return null;
  }

  function validarIntegridadeDosDados() {
    var problemas = [];

    // Verificar 5 horários por dia por turma
    for (var dia = 1; dia <= 5; dia++) {
      var linhas = DADOS_DA_GRADE[dia];
      if (!linhas || linhas.length !== 5) {
        problemas.push('Dia ' + dia + ': esperados 5 hor\u00E1rios, encontrados ' + (linhas ? linhas.length : 0));
      }
    }

    // Verificar conflitos de professor
    for (var d = 1; d <= 5; d++) {
      var linhasD = DADOS_DA_GRADE[d];
      if (!linhasD) continue;
      for (var h = 0; h < linhasD.length; h++) {
        var profsNoHorario = {};
        for (var t = 0; t < ORDEM_DAS_TURMAS.length; t++) {
          var cel = linhasD[h][t];
          if (!cel || cel.trim() === '') continue;
          var p = cel.split('|');
          if (p.length < 2) continue;
          var prof = p[1].trim().toUpperCase();
          if (profsNoHorario[prof]) {
            problemas.push('Conflito: ' + prof + ' em ' + profsNoHorario[prof] + ' e ' + ORDEM_DAS_TURMAS[t] + ' (dia ' + d + ', ' + CONFIGURACAO.horarios[h].inicio + ')');
          }
          profsNoHorario[prof] = ORDEM_DAS_TURMAS[t];
        }
      }
    }

    // Verificar turmas no mapa de salas
    for (var ti = 0; ti < ORDEM_DAS_TURMAS.length; ti++) {
      var turma = ORDEM_DAS_TURMAS[ti];
      if (!SALAS_DAS_TURMAS[turma] && turma !== 'ROBOTICA') {
        problemas.push('Turma ' + turma + ' n\u00E3o encontrada no mapa de salas');
      }
    }

    // Verificar disciplinas com nome
    for (var di = 1; di <= 5; di++) {
      var linhasDi = DADOS_DA_GRADE[di];
      if (!linhasDi) continue;
      for (var hi = 0; hi < linhasDi.length; hi++) {
        for (var ti2 = 0; ti2 < ORDEM_DAS_TURMAS.length; ti2++) {
          var celula = linhasDi[hi][ti2];
          if (!celula || celula.trim() === '') continue;
          var partesD = celula.split('|');
          var siglaD = partesD[0].trim();
          if (!DISCIPLINAS[siglaD]) {
            problemas.push('Disciplina desconhecida: ' + siglaD + ' (dia ' + di + ', ' + CONFIGURACAO.horarios[hi].inicio + ', ' + ORDEM_DAS_TURMAS[ti2] + ')');
          }
        }
      }
    }

    return problemas;
  }

  function obterDiasComAulaDoProfessor(chave) {
    var dias = [];
    if (!indicePorProfessor[chave]) return dias;
    for (var d = 1; d <= 5; d++) {
      if (indicePorProfessor[chave][d] && indicePorProfessor[chave][d].length > 0) {
        dias.push(d);
      }
    }
    return dias;
  }

  function formatarNomeTurma(codigo) {
    if (codigo === 'ROBOTICA' || codigo === 'TV_INTERATIVA') return 'TV Interativa';
    return codigo.charAt(0) + '\u00BA ' + codigo.charAt(1);
  }

  /* ================================================================
     MINI MAPA SVG DO PISO
     Reproduz visualmente o corredor do piso com todas as salas,
     destacando a sala da aula atual e esmaecendo as demais.
     ================================================================ */

  var LAYOUT_PISOS = {
    1: { turmas: ['8A', '7C', '7A'] },
    2: { turmas: ['7D', '6A', '6B', '7B'] },
    3: { turmas: ['ROBOTICA', '9C', '8B', '8C'] }
  };

  var COR_PISO = {
    1: { fundo: '#1E6FD9', texto: '#FFFFFF' },
    2: { fundo: '#2E9D42', texto: '#FFFFFF' },
    3: { fundo: '#7B3FB5', texto: '#FFFFFF' }
  };

  function gerarRotuloTurma(codigo) {
    if (codigo === 'ROBOTICA' || codigo === 'TV_INTERATIVA') return 'TV';
    return codigo.charAt(0) + '\u00BA' + codigo.charAt(1);
  }

  function gerarMiniMapaPiso(piso, turmaDestaque) {
    var layout = LAYOUT_PISOS[piso];
    if (!layout) return null;

    var turmas = layout.turmas;
    var cores = COR_PISO[piso] || { fundo: '#1F3A8A', texto: '#FFFFFF' };

    // Dimensões do SVG
    var alturaTotal = 50;
    var badgeLargura = 66;
    var espacamento = 6;
    var salasLargura = 46;
    var altSala = 36;
    var yOffset = (alturaTotal - altSala) / 2;
    var larguraTotal = badgeLargura + espacamento + turmas.length * (salasLargura + espacamento);

    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('xmlns', ns);
    svg.setAttribute('viewBox', '0 0 ' + larguraTotal + ' ' + alturaTotal);
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', 'auto');
    svg.setAttribute('preserveAspectRatio', 'xMinYMid meet');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Mapa do Piso ' + piso + ' — sala: ' + turmaDestaque);

    // ── Badge do Piso ──────────────────────────────
    var rectBadge = document.createElementNS(ns, 'rect');
    rectBadge.setAttribute('x', '0');
    rectBadge.setAttribute('y', String(yOffset));
    rectBadge.setAttribute('width', String(badgeLargura));
    rectBadge.setAttribute('height', String(altSala));
    rectBadge.setAttribute('rx', '7');
    rectBadge.setAttribute('fill', cores.fundo);
    svg.appendChild(rectBadge);

    // Ícone de degraus (3 retângulos em escada)
    var degrausDados = [
      { x: 7,  yy: yOffset + altSala - 10, w: 16, h: 3 },
      { x: 11, yy: yOffset + altSala - 17, w: 12, h: 3 },
      { x: 15, yy: yOffset + altSala - 24, w: 8,  h: 3 }
    ];
    for (var d = 0; d < degrausDados.length; d++) {
      var dr = document.createElementNS(ns, 'rect');
      dr.setAttribute('x', String(degrausDados[d].x));
      dr.setAttribute('y', String(degrausDados[d].yy));
      dr.setAttribute('width', String(degrausDados[d].w));
      dr.setAttribute('height', String(degrausDados[d].h));
      dr.setAttribute('rx', '1');
      dr.setAttribute('fill', 'rgba(255,255,255,0.45)');
      svg.appendChild(dr);
    }

    // Texto PISO / número
    var cx = badgeLargura / 2 + 8;
    var txtP = document.createElementNS(ns, 'text');
    txtP.setAttribute('x', String(cx));
    txtP.setAttribute('y', String(yOffset + altSala / 2 - 6));
    txtP.setAttribute('text-anchor', 'middle');
    txtP.setAttribute('dominant-baseline', 'middle');
    txtP.setAttribute('font-family', '"Trebuchet MS","Segoe UI",Arial,sans-serif');
    txtP.setAttribute('font-size', '9');
    txtP.setAttribute('font-weight', '800');
    txtP.setAttribute('letter-spacing', '1');
    txtP.setAttribute('fill', cores.texto);
    txtP.textContent = 'PISO';
    svg.appendChild(txtP);

    var txtN = document.createElementNS(ns, 'text');
    txtN.setAttribute('x', String(cx));
    txtN.setAttribute('y', String(yOffset + altSala / 2 + 11));
    txtN.setAttribute('text-anchor', 'middle');
    txtN.setAttribute('dominant-baseline', 'middle');
    txtN.setAttribute('font-family', '"Trebuchet MS","Segoe UI",Arial,sans-serif');
    txtN.setAttribute('font-size', '17');
    txtN.setAttribute('font-weight', '900');
    txtN.setAttribute('fill', cores.texto);
    txtN.textContent = String(piso);
    svg.appendChild(txtN);

    // ── Salas do piso ──────────────────────────────
    for (var i = 0; i < turmas.length; i++) {
      var codigo = turmas[i];
      var xSala = badgeLargura + espacamento + i * (salasLargura + espacamento);
      var estaDestacada = (codigo === turmaDestaque);
      var ehTv = (codigo === 'ROBOTICA' || codigo === 'TV_INTERATIVA');

      var g = document.createElementNS(ns, 'g');
      if (!estaDestacada) g.setAttribute('opacity', '0.38');

      var caixaSala = document.createElementNS(ns, 'rect');
      caixaSala.setAttribute('x', String(xSala));
      caixaSala.setAttribute('y', String(yOffset));
      caixaSala.setAttribute('width', String(salasLargura));
      caixaSala.setAttribute('height', String(altSala));
      caixaSala.setAttribute('rx', '7');
      if (estaDestacada) {
        caixaSala.setAttribute('fill', '#FFFFFF');
        caixaSala.setAttribute('stroke', cores.fundo);
        caixaSala.setAttribute('stroke-width', '3');
      } else {
        caixaSala.setAttribute('fill', '#E8EFF8');
        caixaSala.setAttribute('stroke', '#BCC8D8');
        caixaSala.setAttribute('stroke-width', '1.5');
      }
      g.appendChild(caixaSala);

      var textoSala = document.createElementNS(ns, 'text');
      textoSala.setAttribute('x', String(xSala + salasLargura / 2));
      textoSala.setAttribute('y', String(yOffset + altSala / 2 + 1));
      textoSala.setAttribute('text-anchor', 'middle');
      textoSala.setAttribute('dominant-baseline', 'middle');
      textoSala.setAttribute('font-family', '"Trebuchet MS","Segoe UI",Arial,sans-serif');
      textoSala.setAttribute('font-size', ehTv ? '8' : '13');
      textoSala.setAttribute('font-weight', '900');
      textoSala.setAttribute('fill', estaDestacada ? cores.fundo : '#4A5568');
      textoSala.textContent = gerarRotuloTurma(codigo);
      g.appendChild(textoSala);

      svg.appendChild(g);

      if (estaDestacada) {
        var dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', String(xSala + salasLargura / 2));
        dot.setAttribute('cy', String(yOffset + altSala + 6));
        dot.setAttribute('r', '2.5');
        dot.setAttribute('fill', cores.fundo);
        svg.appendChild(dot);
      }
    }

    return svg;
  }

  function renderizarCartaoDeAula(aula, modo) {
    // modo: 'professor' (mostra turma) ou 'turma' (mostra professor)
    var classeCSS = 'cartao-aula';
    if (aula.sala && aula.sala.piso) {
      classeCSS += ' cartao-aula--piso-' + aula.sala.piso;
    }
    var selo = null;

    switch (aula.classe) {
      case 'EM_ANDAMENTO':
        classeCSS += ' cartao-aula--agora';
        selo = { texto: 'AGORA', classe: 'selo--agora' };
        break;
      case 'PROXIMA':
        classeCSS += ' cartao-aula--proxima';
        selo = { texto: 'PR\u00D3XIMA', classe: 'selo--proxima' };
        break;
      case 'A_SEGUIR':
        classeCSS += ' cartao-aula--proxima';
        selo = { texto: 'A SEGUIR', classe: 'selo--a-seguir' };
        break;
      case 'PASSADA':
        classeCSS += ' cartao-aula--passada';
        selo = { texto: 'ENCERRADA', classe: 'selo--encerrada' };
        break;
      case 'FUTURA':
        classeCSS += ' cartao-aula--futura';
        break;
      case 'CONSULTA':
        break;
    }

    var cartao = criarElementoSeguro('div', { className: classeCSS, role: 'article' });

    // Cabeçalho: horário e selo
    var cabecalho = criarElementoSeguro('div', { className: 'cartao-cabecalho' });

    var horarioTexto = aula.inicio + '\u2013' + aula.fim + '  \u00B7  ' + aula.numeroDaAula + '\u00AA aula';
    var horarioEl = criarElementoSeguro('span', { className: 'cartao-horario' }, horarioTexto);
    cabecalho.appendChild(horarioEl);

    var seloContainer = criarElementoSeguro('span');
    if (selo) {
      var seloEl = criarElementoSeguro('span', { className: 'selo ' + selo.classe }, selo.texto);
      seloContainer.appendChild(seloEl);
    }
    if (aula.aulaDupla) {
      var seloDupla = criarElementoSeguro('span', { className: 'selo selo--aula-dupla' }, 'Aula dupla (' + aula.aulaDupla.parte + '/' + aula.aulaDupla.total + ')');
      seloContainer.appendChild(document.createTextNode(' '));
      seloContainer.appendChild(seloDupla);
    }
    cabecalho.appendChild(seloContainer);
    cartao.appendChild(cabecalho);

    // Corpo: disciplina (sem linha da turma e sem piso)
    var corpo = criarElementoSeguro('div', { className: 'cartao-corpo' });

    var disciplina = criarElementoSeguro('div', { className: 'cartao-disciplina', title: aula.disciplinaSigla }, aula.disciplinaNome);
    corpo.appendChild(disciplina);

    // Quando visualizado na aba Turma, informa quem é o(a) professor(a)
    if (modo !== 'professor') {
      var profInfo = criarElementoSeguro('div', { className: 'cartao-professor' }, 'Prof.: ' + aula.professorNome);
      corpo.appendChild(profInfo);
    }

    cartao.appendChild(corpo);

    // Contagem regressiva (alinhada à direita quando em andamento ou próxima)
    if (aula.classe === 'EM_ANDAMENTO' || aula.classe === 'PROXIMA' || aula.classe === 'A_SEGUIR') {
      var momento = obterMomentoAtual();
      var tempo = calcularTempoRestanteParaAula(aula, momento);
      if (tempo) {
        var textoTempo = '';
        if (tempo.tipo === 'termina') {
          textoTempo = 'Termina em ' + tempo.minutos + ' min';
        } else {
          textoTempo = 'Come\u00E7a em ' + tempo.minutos + ' min';
        }
        var rodape = criarElementoSeguro('div', { className: 'cartao-rodape' });
        var contagemEl = criarElementoSeguro('span', { className: 'contagem-regressiva' }, textoTempo);
        rodape.appendChild(contagemEl);
        cartao.appendChild(rodape);
      }
    }

    // Mini mapa SVG do piso (exibe todas as salas do andar, destacando a sala/turma da aula)
    if (aula.sala && aula.sala.piso && aula.turma) {
      var svgMapa = gerarMiniMapaPiso(aula.sala.piso, aula.turma);
      if (svgMapa) {
        var divMapa = criarElementoSeguro('div', { className: 'mini-mapa-piso' });
        divMapa.appendChild(svgMapa);
        cartao.appendChild(divMapa);
      }
    }

    return cartao;
  }

  function renderizarSeletorDeDia(diaAtual, ehHoje) {
    var container = criarElementoSeguro('div', { className: 'seletor-de-dia' });

    for (var d = 1; d <= 5; d++) {
      var classeBtn = 'dia-botao';
      if (d === diaAtual) classeBtn += ' dia-botao--ativo';
      if (ehHoje && d === obterDiaDaSemanaHoje()) classeBtn += ' dia-botao--hoje';
      var btn = criarElementoSeguro('button', {
        className: classeBtn,
        'data-dia': String(d),
        'aria-label': NOMES_DOS_DIAS[d],
        type: 'button'
      }, NOMES_CURTOS_DOS_DIAS[d]);
      btn.addEventListener('click', function() {
        alternarDiaConsultado(parseInt(this.getAttribute('data-dia'), 10));
      });
      container.appendChild(btn);
    }

    var botaoHoje = criarElementoSeguro('button', {
      className: 'botao-hoje',
      type: 'button',
      'aria-label': 'Voltar para hoje'
    }, 'Hoje');
    botaoHoje.addEventListener('click', function() {
      alternarDiaConsultado(null);
    });
    container.appendChild(botaoHoje);

    return container;
  }

  function obterDiaDaSemanaHoje() {
    var agora = new Date();
    var dia = agora.getDay();
    if (dia >= 1 && dia <= 5) return dia;
    return null;
  }

  function renderizarAbaDeProfessor() {
    var areaPrincipal = document.getElementById('area-principal');
    limparElemento(areaPrincipal);

    // Seletor de dia
    var diaConsultado = obterDiaDeConsulta();
    var ehHoje = (estadoDoSistema.diaConsultado === null);
    areaPrincipal.appendChild(renderizarSeletorDeDia(diaConsultado, ehHoje));

  function processarBuscaProfessor(texto) {
    var areaResultados = document.getElementById('lista-de-resultados');
    if (!areaResultados) return;
    limparElemento(areaResultados);

    if (!texto || texto.trim() === '') {
      renderizarListaDeProfessores();
      return;
    }

    var resultados = buscarProfessoresPorTexto(texto);

    if (resultados.length === 0) {
      renderizarMensagemDeEstadoVazio('nenhum-resultado', areaResultados);
      return;
    }

    if (resultados.length === 1) {
      estadoDoSistema.professorSelecionado = resultados[0].chave;
      renderizarResultadoProfessor(resultados[0].chave, obterDiaDeConsulta());
      return;
    }

    // Múltiplos resultados
    var rotulo = criarElementoSeguro('div', { className: 'secao-rotulo' }, 'Encontramos mais de um. Toque no correto:');
    areaResultados.appendChild(rotulo);

    var listaSugestoes = criarElementoSeguro('div', { className: 'lista-de-sugestoes' });
    for (var i = 0; i < resultados.length; i++) {
      var chip = criarElementoSeguro('button', {
        className: 'sugestao-chip',
        'data-chave': resultados[i].chave,
        type: 'button'
      }, resultados[i].nome);
      chip.addEventListener('click', function() {
        var chave = this.getAttribute('data-chave');
        selecionarSugestaoProfessor(chave, PROFESSORES[chave] || chave);
      });
      listaSugestoes.appendChild(chip);
    }
    areaResultados.appendChild(listaSugestoes);
  }

  function renderizarResultadoProfessor(chave, dia) {
    var areaResultados = document.getElementById('lista-de-resultados');
    if (!areaResultados) return;
    limparElemento(areaResultados);

    var nome = PROFESSORES[chave] || chave;
    var aulas = obterAulasDoProfessor(chave, dia);

    // Cabeçalho

    cabecalhoResultado.appendChild(nomeEl);
    var diaInfo = criarElementoSeguro('span', {}, NOMES_DOS_DIAS[dia] || '');
    cabecalhoResultado.appendChild(diaInfo);
    areaResultados.appendChild(cabecalhoResultado);

    if (aulas.length === 0) {
      var msg = criarElementoSeguro('div', { className: 'mensagem-estado' });

      msg.appendChild(textoMsg);

      var diasComAula = obterDiasComAulaDoProfessor(chave);

    // Ordenar e renderizar
    var momento = obterMomentoAtual();

    var ehConsultaOutroDia = (estadoDoSistema.diaConsultado !== null && estadoDoSistema.diaConsultado !== obterDiaDaSemanaHoje());
    var aulasOrdenadas = ordenarAulasParaExibicao(aulas, situacao, ehConsultaOutroDia);

  function inserirJanelasNaLista(aulasOrdenadas, dia, ehConsultaOutroDia, situacao) {
    var numerosComAula = {};
    for (var i = 0; i < aulasOrdenadas.length; i++) {
      numerosComAula[aulasOrdenadas[i].numeroDaAula] = true;
    }

    var resultado = [];
    for (var h = 0; h < CONFIGURACAO.horarios.length; h++) {
      var horario = CONFIGURACAO.horarios[h];
      if (!numerosComAula[horario.numero]) {
        var janela = {
          ehJanela: true,
          dia: dia,
          numeroDaAula: horario.numero,
          inicio: horario.inicio,
          fim: horario.fim,
          inicioEmMinutos: converterHoraParaMinutos(horario.inicio),
          fimEmMinutos: converterHoraParaMinutos(horario.fim)
        };
        resultado.push(janela);
      }
    }

    // Juntar e ordenar tudo cronologicamente
    var tudo = aulasOrdenadas.concat(resultado);
    if (ehConsultaOutroDia) {
      tudo.sort(function(a, b) { return a.inicioEmMinutos - b.inicioEmMinutos; });
    } else {
      // Manter a ordem original mas inserir janelas na posição certa
      tudo.sort(function(a, b) {
        if (a.ehJanela && !b.ehJanela) {
          if (a.classe === undefined) return 1; // janelas ao final
        }
        return 0;
      });
      // Melhor abordagem: intercalar pelo número da aula
      tudo = aulasOrdenadas.slice();
      for (var j = 0; j < resultado.length; j++) {
        tudo.push(resultado[j]);
      }
    }

    return tudo;
  }
